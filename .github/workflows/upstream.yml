name: Check Pstack upstream
on:
  schedule:
    - cron: '17 8 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pstack-upstream-maintenance
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - id: sync
        run: python scripts/sync_upstream.py
      - name: Validate candidate directly
        id: validation
        if: steps.sync.outputs.changed == 'true'
        continue-on-error: true
        run: |
          python -m unittest discover -s tests -v
          python scripts/build.py --check
      - name: Open or update the maintenance draft
        if: steps.sync.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: python scripts/maintenance_pr.py
      - name: Recover a missing draft without rewriting its branch
        if: steps.sync.outputs.recover_pr == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: python scripts/maintenance_pr.py --existing-only
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always() && steps.sync.outputs.changed == 'true'
        with:
          name: unqualified-upstream-preview
          path: |
            dist/
            docs/upstream-update.md
            resources/coverage.json
      - name: Keep pending adaptation visibly failing
        if: always() && steps.validation.outcome == 'failure'
        run: |
          echo 'Upstream source changed. Adaptation review and passing checks are required; this preview is not release-qualified.'
          exit 1
